[package]
name = "pessimistic-proof-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["sp1"]
sp1 = ["dep:sp1-zkvm"]
zisk = ["dep:ziskos"]
# Opt-in for host builds that deliberately skip the in-guest SP1 verification
# (witness generation, tooling). Never enable it for a guest or a verifier.
zisk-sp1-unverified-host = []
zisk-sp1 = [
    "zisk",
    "dep:bincode",
    "dep:slop-algebra",
    "dep:sp1-primitives",
    "dep:sp1-recursion-executor",
    "dep:sp1-verifier",
]
testutils = [
    "agglayer-primitives/testutils",
    "unified-bridge/testutils",
    "alloy-primitives/arbitrary",
    "dep:arbitrary",
    "dep:rand",
]

[dependencies]
agglayer-bincode.workspace = true
agglayer-primitives.workspace = true
agglayer-tries.workspace = true
unified-bridge.workspace = true

alloy-primitives.workspace = true
arbitrary = { workspace = true, optional = true }
hex = "0.4.3"
hex-literal = "1.1"
tracing = "0.1.44"
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3" }
thiserror = "2.0.18"
rand = { version = "0.9.0", optional = true }
sp1-zkvm = { workspace = true, features = ["verify"], optional = true }
ziskos = { version = "=1.2.0-alpha", optional = true }
bincode = { version = "1.3.3", optional = true }
slop-algebra = { version = "=6.2.2", optional = true }
sp1-primitives = { version = "=6.2.2", optional = true }
sp1-recursion-executor = { version = "=6.2.2", optional = true }
sp1-verifier = { version = "=6.2.2", optional = true }

[dev-dependencies]
alloy.workspace = true
unified-bridge = { workspace = true, features = ["testutils"] }
rand = "0.9.0"
rstest.workspace = true

[build-dependencies]
semver = "1.0"
toml.workspace = true

[package.metadata.cargo-udeps.ignore]
normal = ["sp1-zkvm"]
